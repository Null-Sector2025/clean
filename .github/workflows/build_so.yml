name: Build libstrong_core Android SO (NDK r24)

# 触发策略：仅C源码/配置变更才运行，单独修改所有.py文件直接忽略工作流
on:
  push:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
      - '.github/workflows/build_so.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
      - '.github/workflows/build_so.yml'

jobs:
  build_arm64_v8a:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库源码
        uses: actions/checkout@v4

      - name: 安装Android NDK r24 稳定版
        uses: android-actions/setup-ndk@v1
        with:
          ndk-version: r24

      - name: 使用NDK官方clang编译标准安卓so
        run: |
          export CLANG_BIN=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          # 编译参数：生成共享库、位置无关代码、精简体积、链接基础动态库
          $CLANG_BIN -shared -fPIC -s -ldl strong_core.c -o libstrong_core.so

      - name: 上传编译成品SO作为持久化制品
        uses: actions/upload-artifact@v4
        with:
          name: libstrong_core-arm64-v8a
          path: libstrong_core.so
          retention-days: 90
