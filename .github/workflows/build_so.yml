name: Build libstrong_core Android SO (NDK r24)

on:
  push:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
      - '.github/workflows/build_so.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
      - '.github/workflows/build_so.yml'
  # 网页手动启动工作流，点Run workflow按钮
  workflow_dispatch:

jobs:
  build_arm64_v8a:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库源码
        uses: actions/checkout@v4

      # 替换为可用的ndk安装action
      - name: Setup Android NDK r24
        id: setup_ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r24
          add-to-path: false

      - name: 编译 libstrong_core.so
        run: |
          export ANDROID_NDK_HOME=${{ steps.setup_ndk.outputs.ndk-path }}
          CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          $CLANG -shared -fPIC -s -ldl -Wall strong_core.c -o libstrong_core.so

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: libstrong_core-arm64-v8a
          path: libstrong_core.so
          retention-days: 90

      - name: 上传编译成品SO作为持久化制品
        uses: actions/upload-artifact@v4
        with:
          name: libstrong_core-arm64-v8a
          path: libstrong_core.so
          retention-days: 90
